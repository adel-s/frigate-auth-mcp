[project]
name = "frigate-auth-mcp"
version = "0.1.1"
description = "MCP server with authentication for Frigate NVR (authenticated port, viewer role)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/adel-s/frigate-auth-mcp"
Issues = "https://github.com/adel-s/frigate-auth-mcp/issues"

[project.scripts]
frigate-auth-mcp = "frigate_auth_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frigate_auth_mcp"]
