name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  MCP_PUBLISHER_VERSION: v1.8.6

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # PyPI Trusted Publishing, no API token
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build
        run: uv build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    name: Publish to the MCP Registry
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # MCP Registry GitHub OIDC login, no token
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6   # v4.1.2
      - name: Install mcp-publisher
        run: |
          base=https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}
          curl -fsSLO "$base/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "$base/mcp-publisher_linux_amd64.tar.gz.sigstore.json"
          cosign verify-blob mcp-publisher_linux_amd64.tar.gz \
            --bundle mcp-publisher_linux_amd64.tar.gz.sigstore.json \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          rm mcp-publisher_linux_amd64.tar.gz*
      - name: Wait until PyPI serves this version
        run: |
          version=$(jq -r .version server.json)
          for i in $(seq 30); do
            curl -fsS "https://pypi.org/pypi/frigate-auth-mcp/$version/json" >/dev/null && exit 0
            sleep 20
          done
          echo "PyPI does not serve frigate-auth-mcp $version" >&2
          exit 1
      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
