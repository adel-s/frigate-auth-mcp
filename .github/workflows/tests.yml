name: tests

on:
  push:
    branches:
      - master
      - 'dev/**'

jobs:
  unittest:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - name: Run unit tests
        run: >
          docker run --rm -v "$PWD:/src" -w /src -e PYTHONDONTWRITEBYTECODE=1
          python:${{ matrix.python }}-slim
          sh -c 'pip install -q --root-user-action=ignore . && python3 -m unittest discover -s tests -v'
